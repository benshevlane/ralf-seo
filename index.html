<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ralf marketing staging</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#121212}
#preview{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.rail{position:fixed;z-index:100;left:14px;top:50%;transform:translateY(-50%);width:154px;padding:8px;background:rgba(18,18,18,.94);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.22);backdrop-filter:blur(14px)}.head{padding:5px 7px 9px}.ey{font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:#6ee7b7}.title{font-size:12px;font-weight:650;margin-top:6px}.tab{width:100%;border:0;background:transparent;color:rgba(255,255,255,.62);padding:9px 8px;border-radius:9px;text-align:left;cursor:pointer;font:600 11px/1.2 system-ui;transition:.15s}.tab span{display:block;font:8px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(255,255,255,.38);margin-top:3px}.tab:hover{background:rgba(255,255,255,.06);color:#fff}.tab.on{background:#fff;color:#121212}.tab.on span{color:#64748b}.open{display:block;margin:7px 3px 2px;padding:7px;text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:rgba(255,255,255,.72);font:8px ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none}.open:hover{color:#fff;border-color:rgba(255,255,255,.32)}
@media(max-width:700px){.rail{left:auto;right:8px;top:8px;transform:none;width:auto;display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px}.head{padding:5px 6px}.head .title{display:none}.tab{width:auto;padding:7px 9px;font-size:9px}.tab span{display:none}.open{display:none}}
</style>
</head>
<body>
<iframe id="preview" title="Ralf marketing staging preview" src="staging-v1.html"></iframe>
<aside class="rail" aria-label="Staging version switcher">
  <div class="head"><div class="ey">Staging</div><div class="title">Hero animation</div></div>
  <button class="tab on" type="button" data-src="staging-v1.html" data-name="Version 1"><b>Version 1</b><span>faster carousel</span></button>
  <button class="tab" type="button" data-src="staging-v2.html" data-name="Version 2"><b>Version 2</b><span>connected story</span></button>
  <a class="open" id="openClean" href="staging-v1.html" target="_blank" rel="noopener">Open without sidebar ↗</a>
</aside>
<script>
(function(){var frame=document.getElementById('preview'),tabs=[].slice.call(document.querySelectorAll('.tab')),open=document.getElementById('openClean');function choose(tab,push){tabs.forEach(function(t){t.classList.toggle('on',t===tab)});frame.src=tab.dataset.src;open.href=tab.dataset.src;if(push!==false)history.replaceState(null,'','#'+(tab.dataset.src.indexOf('v2')>-1?'v2':'v1'))}tabs.forEach(function(tab){tab.addEventListener('click',function(){choose(tab,true)})});if(location.hash==='#v2')choose(tabs[1],false)})();
</script>
</body>
</html>
