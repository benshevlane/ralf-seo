<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Ralf Marketing Staging</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#121212;background:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#ecfdf5,transparent 45%),#fff}
    .load{width:min(520px,calc(100% - 40px));border:1px solid rgba(18,18,18,.12);border-radius:18px;padding:28px;background:rgba(255,255,255,.94);box-shadow:0 30px 80px -50px rgba(4,120,87,.55);text-align:center}
    .mark{width:34px;height:34px;margin:0 auto 16px;color:#059669;animation:spin 2.2s linear infinite}
    h1{font-size:20px;margin:0 0 8px}p{margin:0;color:rgba(18,18,18,.62);line-height:1.55}.err{color:#9f1239;text-align:left;white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:18px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.mark{animation:none}}
  </style>
</head>
<body>
  <main class="load" id="loader" aria-live="polite">
    <svg class="mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c1.1 6 4.9 9.8 11 12-6.1 2.2-9.9 6-11 12-1.1-6-4.9-9.8-11-12 6.1-2.2 9.9-6 11-12Z"/></svg>
    <h1>Opening Ralf staging</h1>
    <p>Loading the isolated marketing review build…</p>
    <div class="err" id="error" hidden></div>
  </main>
<script>
(async function(){
  const SOURCE_COMMIT='3c2a8fda913816b6d4ea078a586ef0a6fefc78db';
  const SOURCE_ROOT='https://raw.githubusercontent.com/benshevlane/ralf-seo/'+SOURCE_COMMIT+'/';

  function extractTemplate(source,name){
    const marker='const '+name+' = String.raw`';
    const start=source.indexOf(marker);
    if(start<0) throw new Error('Could not load '+name+' from the staging build.');
    const bodyStart=start+marker.length;
    const end=source.indexOf('`;',bodyStart);
    if(end<0) throw new Error('Could not finish loading '+name+'.');
    return source.slice(bodyStart,end);
  }

  function replaceBalancedDiv(source,marker,replacement){
    const start=source.indexOf(marker);
    if(start<0) throw new Error('The current Ralf hero could not be located.');
    const openEnd=source.indexOf('>',start);
    const tags=/<div\b[^>]*>|<\/div\s*>/gi;
    tags.lastIndex=openEnd+1;
    let depth=1,match;
    while((match=tags.exec(source))){
      if(/^<div\b/i.test(match[0])) depth+=1; else depth-=1;
      if(depth===0) return source.slice(0,start)+replacement+source.slice(tags.lastIndex);
    }
    throw new Error('The current Ralf hero was incomplete.');
  }

  function applyAccessibility(html){
    html=html.replace('id="rhLoop" tabindex="0" aria-roledescription="carousel"','id="rhLoop" tabindex="0" role="region" aria-roledescription="carousel"');
    html=html.replace('<div class="rh-stage" aria-live="polite">','<div class="rh-stage" aria-live="off">');
    html=html.replace("  var email=root.querySelector('[data-rh-email]');\n  var reduce=","  var email=root.querySelector('[data-rh-email]');\n  var stage=root.querySelector('.rh-stage');\n  var reduce=");
    html=html.replace("    toggle.setAttribute('aria-label',userPaused?'Play animation':'Pause animation');\n  }","    toggle.setAttribute('aria-label',userPaused?'Play animation':'Pause animation');\n    if(stage)stage.setAttribute('aria-live',userPaused?'polite':'off');\n  }");
    html=html.replace("d.setAttribute('aria-current',ix===current?'step':'false');","if(ix===current)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current');");
    html=html.replace("  toggle.addEventListener('click',function(){userPaused=!userPaused;refresh();});","  toggle.addEventListener('click',function(){userPaused=!userPaused;if(!userPaused){hoverPaused=false;focusPaused=false;}refresh();});");
    if(!html.includes('if(reduce)toggle.hidden=true;')) html=html.replace('  setToggle();show(0);','  if(reduce)toggle.hidden=true;\n  setToggle();show(0);');
    return html;
  }

  function makeReviewSafe(html){
    const analyticsStart=html.indexOf('<!-- Google tag (gtag.js) -->');
    const metaStart=html.indexOf('<meta charset=',analyticsStart);
    if(analyticsStart>=0&&metaStart>analyticsStart) html=html.slice(0,analyticsStart)+html.slice(metaStart);
    html=html.replace(/<meta name="robots"[^>]*>/i,'<meta name="robots" content="noindex,nofollow,noarchive">');
    html=html.replace('<body>','<body><div id="top"></div>');
    html=html.replace(/href="\/#faq"/g,'href="#faq"');
    html=html.replace(/href="\/"/g,'href="#top"');
    html=html.replace(/(href|src)="\/assets\//g,'$1="https://ralfhq.com/assets/');
    html=html.replace(/href="\/([^"#][^"]*)"/g,'href="https://ralfhq.com/$1"');
    html=html.replace('</head>','<style>#ralf-staging-badge{position:fixed;left:14px;bottom:14px;z-index:2147483647;background:#121212;color:#fff;border-radius:999px;padding:7px 11px;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.18)}</style></head>');
    html=html.replace('</body>','<div id="ralf-staging-badge">Staging</div></body>');
    return html;
  }

  try{
    const responses=await Promise.all([
      fetch(SOURCE_ROOT+'index.html',{cache:'no-store'}),
      fetch(SOURCE_ROOT+'scripts/build-emerald-hero-preview.mjs',{cache:'no-store'})
    ]);
    if(!responses[0].ok||!responses[1].ok) throw new Error('GitHub did not return the staging source.');
    let html=await responses[0].text();
    const build=await responses[1].text();
    const baseCss=extractTemplate(build,'BASE_CSS');
    const heroCss=extractTemplate(build,'HERO_CSS');
    const heroMarkup=extractTemplate(build,'HERO_MARKUP');
    const heroJs=extractTemplate(build,'HERO_JS');
    const heroStart=html.indexOf('<header class="heroB">');
    const heroEnd=html.indexOf('</header>',heroStart);
    if(heroStart<0||heroEnd<0) throw new Error('The homepage hero could not be found.');
    const hero=html.slice(heroStart,heroEnd);
    html=html.slice(0,heroStart)+replaceBalancedDiv(hero,'<div class="stack">',heroMarkup)+html.slice(heroEnd);
    html=html.replace('</head>',baseCss+'\n'+heroCss+'\n</head>');
    html=html.replace('</body>',heroJs+'\n</body>');
    html=applyAccessibility(html);
    html=makeReviewSafe(html);
    document.open();document.write(html);document.close();
  }catch(error){
    const box=document.getElementById('error');box.hidden=false;box.textContent='Preview failed to load.\n\n'+(error&&error.message?error.message:String(error));
    document.querySelector('#loader p').textContent='The staging build could not be assembled.';
  }
})();
</script>
</body>
</html>
