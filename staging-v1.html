<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ralf staging · Version 1</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:#fafafa;color:#121212}.load{text-align:center;padding:32px}.spark{width:34px;height:34px;margin:0 auto 14px;color:#059669;animation:s 1.4s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#666}</style>
</head>
<body>
<main class="load" id="loader"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1.1 6 4.9 9.8 11 12-6.1 2.2-9.9 6-11 12-1.1-6-4.9-9.8-11-12 6.1-2.2 9.9-6 11-12Z"/></svg><strong>Opening Ralf staging…</strong><p id="msg">Loading hero animation version 1.</p></main>
<script>
(async()=>{
const COMMIT='3c2a8fda913816b6d4ea078a586ef0a6fefc78db',ROOT=`https://raw.githubusercontent.com/benshevlane/ralf-seo/${COMMIT}/`;
const template=(s,n)=>{const m=s.match(new RegExp('const\\s+'+n+'\\s*=\\s*String\\.raw`([\\s\\S]*?)`;'));if(!m)throw Error('Missing '+n);return m[1]};
const balanced=(s,marker,repl)=>{const start=s.indexOf(marker),open=s.indexOf('>',start),re=/<div\\b[^>]*>|<\\/div\\s*>/gi;re.lastIndex=open+1;let d=1,m;while((m=re.exec(s))){/^<div\\b/i.test(m[0])?d++:d--;if(!d)return s.slice(0,start)+repl+s.slice(re.lastIndex)}throw Error('Hero stack not found')};
const startBox=`<div class="hero-start"><form class="hero-domain" data-hero-domain><label class="sr-only" for="v1-domain">Your website</label><input id="v1-domain" name="website" type="text" inputmode="url" autocomplete="url" placeholder="yourwebsite.com" aria-label="Enter your website"><button type="submit">Get Ralf working <span>→</span></button></form><div class="hero-domain-note" data-domain-note>Enter your website · Ralf finds the first opportunities</div></div>`;
const FOLD_CSS=String.raw`<style data-above-fold>
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.heroB{padding:28px 0 30px;min-height:calc(100svh - 66px);display:flex;align-items:center}.heroB .grid{width:100%;grid-template-columns:minmax(0,.82fr) minmax(470px,1.18fr);grid-template-areas:"copy anim" "start anim";gap:16px 46px;align-items:center}.heroB .copy{grid-area:copy;align-self:end}.heroB .copy>*:not(h1){display:none!important}.heroB h1{font-size:clamp(42px,5vw,64px);line-height:.98;margin-top:0;max-width:11ch}.heroB .stack{grid-area:anim}.hero-start{grid-area:start;align-self:start;max-width:470px}.hero-domain{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 14px 34px -26px rgba(4,120,87,.42)}.hero-domain:focus-within{border-color:var(--accent-deep);box-shadow:0 0 0 3px rgba(5,150,105,.09)}.hero-domain input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:10px 13px;font:500 14.5px var(--body);color:var(--ink)}.hero-domain input::placeholder{color:var(--mut2)}.hero-domain button{border:0;border-radius:999px;background:var(--accent-grad);color:#fff;padding:11px 15px;font:600 13.5px var(--body);cursor:pointer;white-space:nowrap}.hero-domain button span{margin-left:5px}.hero-domain-note{margin:7px 0 0 14px;font:10px var(--mono);color:var(--mut2)}
@media(max-width:900px){.bar .row{height:56px}.heroB{min-height:calc(100svh - 56px);padding:14px 0 12px;align-items:flex-start}.heroB .grid{grid-template-columns:1fr;grid-template-areas:"copy" "anim" "start";gap:10px}.heroB .copy{align-self:auto}.heroB h1{font-size:clamp(36px,9.6vw,46px);line-height:.96;max-width:11ch}.heroB .stack{width:100%;max-width:620px;margin:0 auto}.hero-start{width:100%;max-width:620px;margin:0 auto}.rh-caption{display:none}.rh-top{height:36px}.rh-stage{min-height:244px!important}.rh-panel{padding:11px 13px 10px;gap:8px;grid-template-rows:auto 1fr}.rh-kicker{font-size:8.5px;margin-bottom:3px}.rh-copy h2{font-size:17px!important;line-height:1.02;max-width:none}.rh-copy p{display:none}.rh-vhead{min-height:28px;padding:6px 9px;font-size:8px}.rh-rows{padding:5px}.rh-row{min-height:29px;padding:4px 6px;font-size:9.5px}.rh-row:nth-child(n+4){display:none}.rh-ic{width:17px;height:17px;flex-basis:17px;font-size:7px}.rh-rank{width:20px;height:20px;flex-basis:20px;font-size:8px}.rh-tag{font-size:7px;padding:2px 5px}.rh-score{font-size:7px}.rh-score b{font-size:9px}.rh-email .rh-field{padding:4px 8px;font-size:8.5px}.rh-email-body{padding:7px 9px;min-height:50px;font-size:9px}.rh-email-foot{padding:6px 8px}.rh-doc{padding:8px}.rh-line{margin:5px 0;height:5px}.rh-fixes{padding:5px 8px}.rh-fix{padding:4px 0;font-size:9px}.rh-controls{height:36px}.rh-control{width:25px;height:25px}.rh-toggle{width:auto}.hero-domain{padding:4px}.hero-domain input{padding:8px 10px;font-size:13.5px}.hero-domain button{padding:9px 12px;font-size:12.5px}.hero-domain-note{display:none}}
@media(max-width:430px){.wrap{padding-left:16px!important;padding-right:16px!important}.heroB h1{font-size:36px}.rh-stage{min-height:230px!important}.hero-domain button{padding-left:10px;padding-right:10px}}
@media(max-height:700px) and (max-width:900px){.heroB{padding-top:8px}.heroB h1{font-size:34px}.rh-stage{min-height:210px!important}.rh-copy h2{font-size:15px!important}.rh-row{min-height:25px}.rh-controls{height:32px}.rh-top{height:32px}.hero-domain input{padding-top:6px;padding-bottom:6px}.hero-domain button{padding-top:7px;padding-bottom:7px}}
</style>`;
try{
 const [pageRes,buildRes]=await Promise.all([fetch(ROOT+'index.html',{cache:'no-store'}),fetch(ROOT+'scripts/build-emerald-hero-preview.mjs',{cache:'no-store'})]);
 if(!pageRes.ok||!buildRes.ok)throw Error('Could not load staging source');
 let html=await pageRes.text(),build=await buildRes.text();
 build=build.replace('var durations=[4700,4400,4700,5900,4800,4800];','var durations=[2800,2800,3000,3600,3000,3000];');
 build=build.replace('transition:opacity .42s ease,transform .48s cubic-bezier(.22,.61,.36,1),visibility .42s','transition:opacity .24s ease,transform .30s cubic-bezier(.22,.61,.36,1),visibility .24s');
 build=build.replace('animation:rh-scan 2.5s ease-in-out infinite','animation:rh-scan 1.7s ease-in-out infinite');
 build=build.replace("typeTimer=setTimeout(tick,18+(emailCopy.charAt(i-1)===' '?14:0))","typeTimer=setTimeout(tick,11+(emailCopy.charAt(i-1)===' '?8:0))");
 const base=template(build,'BASE_CSS'),css=template(build,'HERO_CSS'),markup=template(build,'HERO_MARKUP'),js=template(build,'HERO_JS');
 const hs=html.indexOf('<header class="heroB">'),he=html.indexOf('</header>',hs);if(hs<0||he<0)throw Error('Homepage hero not found');
 html=html.slice(0,hs)+balanced(html.slice(hs,he),'<div class="stack">',markup)+html.slice(he);
 const heroEnd=html.indexOf('</header>',hs),gridClose=html.lastIndexOf('</div>',heroEnd);html=html.slice(0,gridClose)+startBox+html.slice(gridClose);
 html=html.replace('</head>',base+'\n'+css+'\n'+FOLD_CSS+'\n</head>');
 const safety=`<script data-staging-domain>document.addEventListener('submit',function(e){if(!e.target.matches('[data-hero-domain]'))return;e.preventDefault();var n=e.target.parentElement.querySelector('[data-domain-note]');if(n)n.textContent='Staging preview — this will start Ralf onboarding in production.';});<\/script>`;
 html=html.replace('</body>',js+'\n'+safety+'\n</body>');
 html=html.replace(/<meta name="robots"[^>]*>/i,'<meta name="robots" content="noindex,nofollow,noarchive">');
 html=html.replace(/\\s*<!-- Google tag \\(gtag\\.js\\) -->\\s*<script async[\\s\\S]*?<\\/script>\\s*<script>[\\s\\S]*?<\\/script>/i,'');
 html=html.replace(/(href|src)="\\/assets\\//g,'$1="https://ralfhq.com/assets/').replace(/href="\\/#faq"/g,'href="#faq"').replace(/href="\\/"/g,'href="#top"').replace(/href="\\/([^"#][^"]*)"/g,'href="https://ralfhq.com/$1"');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').textContent='Staging failed to load: '+e.message}
})();
</script>
</body>
</html>
