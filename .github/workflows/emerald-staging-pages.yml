name: Emerald marketing staging

on:
  push:
    branches: [emerald-staging-public]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emerald-marketing-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Prepare public staging artifact
        run: |
          mkdir -p _site
          cp emerald-preview.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public staging
        id: deployment
        uses: actions/deploy-pages@v4
